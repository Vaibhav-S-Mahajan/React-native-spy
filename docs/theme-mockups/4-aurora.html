<!doctype html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme 4 — Aurora · React Native Spy</title>
<link rel="stylesheet" href="base.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   THEME 4 — AURORA
   Dark slate with a violet→cyan gradient accent, glass surfaces,
   generous glow. The most "designed" of the six. Highest visual
   personality without abandoning density — note the gradient is
   confined to accents and never sits behind data text.
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg-app: #0a0b14;
  --bg-chrome: #0e1020;
  --bg-panel: #12142370;
  --bg-panel-alt: #0f1120;
  --bg-card: #1b1e35;
  --bg-input: #161930;
  --bg-code: #0c0e1a;

  --row-hover: #1a1d34;
  --row-selected: #26214d;
  --row-selected-hover: #2e295c;

  --border-subtle: #1e2140;
  --border-default: #2b2f55;
  --border-strong: #464c7d;

  --text-primary: #f1f0ff;
  --text-secondary: #b3b2d8;
  --text-tertiary: #8a89b4;
  --text-link: #8ad8ff;

  --ok-bg: #0d2a26;   --ok-fg: #4fe8c0;   --ok-bd: #175046;
  --warn-bg: #2e2413; --warn-fg: #ffc95c; --warn-bd: #55421f;
  --err-bg: #30162c;  --err-fg: #ff7ec7;  --err-bd: #562542;
  --info-bg: #15243f; --info-fg: #83c2ff; --info-bd: #274170;

  --accent: #a78bfa;
  --accent-hover: #8f6df8;
  --accent-fg: #100a24;
  --accent-soft: rgba(167, 139, 250, 0.18);

  --m-get: #4fe8c0; --m-post: #ffc95c; --m-put: #b79cff;
  --m-delete: #ff7ec7; --m-patch: #d9c8ff;

  --glow: 0 0 10px rgba(79, 232, 192, 0.7);

  --radius-sm: 6px; --radius-md: 9px; --radius-lg: 14px;

  --shadow-sm: 0 1px 2px rgba(4, 2, 20, 0.6);
  --shadow-md: 0 8px 24px rgba(8, 4, 40, 0.6);
  --shadow-lg: 0 16px 44px rgba(8, 4, 40, 0.7);
}

/* Ambient aurora wash behind the whole app */
body {
  background:
    radial-gradient(1100px 520px at 8% -12%, rgba(167, 139, 250, 0.18), transparent 62%),
    radial-gradient(900px 480px at 96% 6%, rgba(79, 232, 192, 0.14), transparent 60%),
    radial-gradient(700px 420px at 50% 108%, rgba(131, 194, 255, 0.10), transparent 62%),
    var(--bg-app);
}

/* Glass surfaces — translucent panels over the wash */
.titlebar, .tabbar, .devicebar, .toolbar, .dtabs, .statusline {
  backdrop-filter: blur(18px) saturate(1.25);
  background-color: rgba(14, 16, 32, 0.72);
}
.pane-list { background: rgba(17, 19, 36, 0.55); backdrop-filter: blur(10px); }
.pane-detail { background: rgba(14, 16, 32, 0.62); backdrop-filter: blur(10px); }
.console { background: rgba(15, 17, 32, 0.66); backdrop-filter: blur(12px); }

/* Gradient accents, confined to indicators — never behind data */
.tab-ink { background: linear-gradient(90deg, #a78bfa, #4fe8c0); }
.btn-accent {
  background: linear-gradient(135deg, #a78bfa, #7ad3ff);
  color: #0d0a20;
  box-shadow: 0 2px 14px rgba(167, 139, 250, 0.45);
}
.btn-accent:hover { background: linear-gradient(135deg, #b79cff, #8ad8ff); }
.track-fill { background: linear-gradient(90deg, #a78bfa, #4fe8c0); }
.row.is-selected::before { background: linear-gradient(180deg, #a78bfa, #4fe8c0); }
.jump {
  background: linear-gradient(135deg, #a78bfa, #7ad3ff);
  color: #0d0a20;
  box-shadow: 0 6px 22px rgba(167, 139, 250, 0.5);
}
.brand-mark { filter: drop-shadow(0 0 7px rgba(167, 139, 250, 0.85)); }
</style>
</head>
<body>
<div id="root"></div>
<div class="theme-tag">Theme 4 · <b>Aurora</b></div>
<script src="harness.js"></script>
<script>mountApp(document.getElementById('root'))</script>
</body>
</html>
