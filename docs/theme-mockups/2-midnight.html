<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme 2 — Midnight · React Native Spy</title>
<link rel="stylesheet" href="base.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   THEME 2 — MIDNIGHT   ← my recommendation for the product default
   Deep blue-black surfaces, indigo accent, soft elevation.
   Linear-adjacent. Calmest of the six for long debugging sessions,
   and the indigo accent leaves red/amber/green entirely free for
   semantic meaning instead of competing with the brand colour.
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg-app: #08090f;
  --bg-chrome: #0b0d15;
  --bg-panel: #0f111a;
  --bg-panel-alt: #0c0e16;
  --bg-card: #171a26;
  --bg-input: #13161f;
  --bg-code: #0a0c12;

  --row-hover: #161a26;
  --row-selected: #1c2340;
  --row-selected-hover: #232b4d;

  --border-subtle: #1b1f2d;
  --border-default: #262c3d;
  --border-strong: #3a4256;

  --text-primary: #eef0f6;
  --text-secondary: #a9afc4;
  --text-tertiary: #7f87a0;
  --text-link: #93b4ff;

  --ok-bg: #0d2620;   --ok-fg: #4ade9f;   --ok-bd: #1a4638;
  --warn-bg: #2a2110; --warn-fg: #f5bd4a; --warn-bd: #4b3a19;
  --err-bg: #2b1620;  --err-fg: #fb7f9c;  --err-bd: #4d2231;
  --info-bg: #131f38; --info-fg: #7aa9ff; --info-bd: #22355e;

  --accent: #6d7cff;
  --accent-hover: #5866f0;
  --accent-fg: #05071a;
  --accent-soft: rgba(109, 124, 255, 0.15);

  --m-get: #4ade9f; --m-post: #f5bd4a; --m-put: #b79cff;
  --m-delete: #fb7f9c; --m-patch: #cdbcff;

  --glow: 0 0 7px rgba(74, 222, 159, 0.55);

  --radius-sm: 5px; --radius-md: 7px; --radius-lg: 10px;

  --shadow-sm: 0 1px 2px rgba(0, 0, 8, 0.5);
  --shadow-md: 0 6px 18px rgba(0, 0, 10, 0.55);
  --shadow-lg: 0 12px 32px rgba(0, 0, 12, 0.65);
}

/* Softer elevation: chrome gets a subtle top highlight */
.titlebar { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03); }
.btn-accent { box-shadow: 0 1px 0 rgba(255,255,255,0.14) inset, var(--shadow-sm); }
</style>
</head>
<body>
<div id="root"></div>
<div class="theme-tag">Theme 2 · <b>Midnight</b></div>
<script src="harness.js"></script>
<script>mountApp(document.getElementById('root'))</script>
</body>
</html>
