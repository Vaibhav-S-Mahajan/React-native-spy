name: Create Draft Release

# Triggered when a semver tag is pushed (e.g. by `make patch`).
# It immediately creates a draft release on GitHub so you can review the
# release notes. The actual build and artifact upload happens later, when
# you click "Publish release" on that draft.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to create a draft release for (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: draft-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
            echo "Draft release $TAG created."
          fi
