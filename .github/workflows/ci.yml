name: CI

# Fast feedback on every push and PR: does the app still build, and does it
# still package? Packaging uses `--dir` (no installers, no publish) so it stays
# quick while still catching electron-builder config breakage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer, preload and main
        run: npm run build

      - name: Package (unpacked, no installers)
        run: npm run build:unpack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
